<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konkurs GPW - Test Dzienny</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --accent: #2563eb;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1, h2 {
      text-align: center;
      color: var(--primary);
    }
    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .alert-info { background-color: #e0f2fe; color: #0369a1; }
    .alert-error { background-color: #fee2e2; color: #b91c1c; }
    .alert-success { background-color: #dcfce7; color: #15803d; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      color: var(--primary);
    }
    .badge-positive { color: #16a34a; font-weight: bold; }
    .badge-negative { color: #dc2626; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>🧪 Konkurs GPW - Wersja Testowa (Dniowa)</h1>
  
  <div class="card">
    <h2>Zgłoś spółkę na dzisiaj</h2>
    <div id="statusAlert" class="alert"></div>
    
    <form id="voteForm">
      <div class="form-group">
        <label for="participant">Imię i Nazwisko:</label>
        <input type="text" id="participant" required placeholder="np. Jan Kowalski">
      </div>
      <div class="form-group">
        <label for="ticker">Ticker spółki z GPW (np. PKN, PKO, CDR):</label>
        <input type="text" id="ticker" required placeholder="np. PKN">
      </div>
      <button type="submit" id="submitBtn">Wyślij typowanie</button>
    </form>
  </div>

  <div class="card">
    <h2>🏆 Tabela Wyników (Test Dzienny)</h2>
    <table>
      <thead>
        <tr>
          <th>Miejsce</th>
          <th>Uczestnik</th>
          <th>Liczba typowań</th>
          <th>Skumulowana Stopa Zwrotu</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <tr><td colspan="4" style="text-align:center;">Ładowanie wyników...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // WKLEJ SWÓJ ADRES APPS SCRIPT PONIŻEJ:
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxoCIgwvGGCqoUe5xkarvRHOPqRTFoD6wNbhghR_U96FWkpWqbTg1UZrWh3gxUd-dPjrQ/exec";

  document.getElementById('voteForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const alertDiv = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    
    const participant = document.getElementById('participant').value;
    const ticker = document.getElementById('ticker').value;

    submitBtn.disabled = true;
    alertDiv.className = "alert alert-info";
    alertDiv.style.display = "block";
    alertDiv.innerText = "Wysyłanie zgłoszenia...";

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ participant, ticker })
      });
      
      const result = await response.json();
      
      if (result.status === 'success') {
        alertDiv.className = "alert alert-success";
        alertDiv.innerText = "✅ Typowanie zapisane w arkuszu!";
        document.getElementById('voteForm').reset();
      } else {
        alertDiv.className = "alert alert-error";
        alertDiv.innerText = "❌ Błąd: " + result.message;
      }
    } catch (err) {
      alertDiv.className = "alert alert-error";
      alertDiv.innerText = "❌ Problem z połączeniem.";
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function loadLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      
      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Brak wyników do wyświetlenia.</td></tr>';
        return;
      }

      data.forEach((row, index) => {
        const percentage = (row.totalReturn * 100).toFixed(2);
        const badgeClass = row.totalReturn >= 0 ? "badge-positive" : "badge-negative";
        const sign = row.totalReturn >= 0 ? "+" : "";

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>#${index + 1}</strong></td>
          <td>${row.participant}</td>
          <td>${row.count}</td>
          <td class="${badgeClass}">${sign}${percentage}%</td>
        `;
        tbody.appendChild(tr);
      });
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nie udało się pobrać wyników.</td></tr>';
    }
  }

  loadLeaderboard();
</script>

</body>
</html>
